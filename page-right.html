    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            padding: 40px;
            min-height: 100vh;
            position: relative;
        }

        /* Эффект шума/зерна на фоне */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.07;
            background-image: url("image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Заголовок (кликабельный) */
        .page-title {
            color: #ff0000;
            font-size: 48px;
            font-family: 'Times New Roman', serif;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .page-title:hover {
            opacity: 0.7;
            transform: scale(0.98);
        }

        /* Журнальные развороты: две фотографии на всю страницу */
        .spreads {
            display: flex;
            flex-direction: column;
            gap: 60px;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .spread {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: min(calc(100vh - 80px), 62vw);
            background-color: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* Сгиб журнала посередине */
        .spread::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 60px;
            transform: translateX(-50%);
            pointer-events: none;
            background: linear-gradient(to right,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.08) 45%,
                rgba(0, 0, 0, 0.18) 50%,
                rgba(0, 0, 0, 0.08) 55%,
                rgba(0, 0, 0, 0) 100%);
        }

        .spread-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* Одно фото на весь разворот, на белом поле */
        .spread--wide {
            grid-template-columns: 1fr;
        }

        .spread--wide .spread-page {
            padding: 4%;
        }

        .spread--wide .spread-page img {
            object-fit: contain;
        }

        .spread-page img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .page-title {
                font-size: 32px;
            }
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            body {
                padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
            }

            .page-title {
                font-size: clamp(22px, 7vw, 32px);
                letter-spacing: 2px;
                margin-bottom: 24px;
            }

            .spreads {
                gap: 24px;
            }

            .spread {
                height: auto;
                aspect-ratio: 3 / 2;
            }

            .spread::after {
                width: 24px;
            }


        }

        /* На сенсорных экранах эффекты наведения не «залипают» */
        @media (hover: none) {
            .page-title:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>
