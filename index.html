<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Page</title>

    <!-- Превью ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="карат">
    <meta property="og:title" content="карат">
    <meta property="og:description" content="FRAGMENTED PERSONALITY 0.1 · Святая Сибирь, Российская Федерация">
    <meta property="og:url" content="https://iamkarat.github.io/fofkt/">
    <meta property="og:image" content="https://iamkarat.github.io/fofkt/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="FRAGMENTED PERSONALITY 0.1 · Святая Сибирь, Российская Федерация">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111111;
        }

        /* Основной экран: шапка и две половины */
        .main-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Шапка */
        .profile-header {
            position: relative;
            flex-shrink: 0;
            height: 12.8vw;
            background-color: #111111;
            background-image: url('images/header-bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            gap: 1.35vw;
            padding: 0 2.25vw;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        .profile-avatar {
            width: 9.5vw;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.4vw;
        }

        .profile-info span {
            background-color: #111111;
            padding: 0.35vw 0.6vw;
            line-height: 1.2;
            color: #cccccc;
            font-size: max(12px, 1.05vw);
            font-weight: 600;
        }

        .profile-info .profile-name {
            color: #ffffff;
            font-size: max(18px, 1.9vw);
            font-weight: 700;
        }

        /* Две половины под шапкой */
        .split {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Левый белый блок */
        .left-block {
            width: 50%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Правый блок с GIF фоном */
        .right-block {
            width: 50%;
            background-color: #000000;
            background-image: url('images/right-background.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Текстовая ссылка вместо правого квадрата */
        .right-block .text-link {
            position: absolute;
            left: 4vw;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            max-width: 80%;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: max(20px, 2.6vw);
            line-height: 1.05;
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .right-block .text-link:hover {
            opacity: 0.7;
        }

        /* Затемнение фона */
        .right-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* Контейнер для GIF */
        .gif-box {
            width: min(22vw, calc((100vh - 12.8vw) * 0.6));
            height: min(22vw, calc((100vh - 12.8vw) * 0.6));
            background-color: #ffffff;
            overflow: hidden;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
        }

        /* Анимация плавания для обоих квадратов */
        .left-block .gif-box,
        .right-block .gif-box {
            animation: float 6s ease-in-out infinite;
        }

        /* Эффект при наведении (приостанавливает плавание) */
        .left-block .gif-box:hover,
        .right-block .gif-box:hover {
            transform: scale(1.05);
            cursor: pointer;
            animation-play-state: paused;
        }

        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gif-link {
            text-decoration: none;
        }

        /* Ключевые кадры анимации плавания */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(1deg);
            }
            50% {
                transform: translateY(0px) rotate(0deg);
            }
            75% {
                transform: translateY(-15px) rotate(-1deg);
            }
        }

        /* Адаптивность для маленьких экранов */
        @media (max-width: 768px) {
            .split {
                flex-direction: column;
            }

            .profile-header {
                height: 170px;
                gap: 16px;
                padding: 0 16px;
            }

            .profile-avatar {
                width: 110px;
            }

            .profile-info span {
                font-size: 13px;
            }

            .profile-info .profile-name {
                font-size: 22px;
            }
            
            .left-block, .right-block {
                width: 100%;
                height: 50vh;
            }
        }

        /* Мобильная адаптация */
        @supports (height: 100dvh) {
            .main-screen,
            .intro {
                height: 100dvh;
            }
        }

        @media (max-width: 768px) {
            .left-block, .right-block {
                height: 50%;
            }

            .gif-box {
                width: min(300px, 62vw, 34vh);
                height: auto;
                aspect-ratio: 1;
            }
        }

        /* Видео на весь экран над страницей */
        .intro {
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
        }

        .intro video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Видео на весь экран -->
    <section class="intro">
        <video id="introVideo" muted playsinline autoplay loop preload="auto" poster="video/intro-poster.jpg"></video>
    </section>

    <div class="main-screen">

    <!-- Шапка профиля -->
    <header class="profile-header">
        <img class="profile-avatar" src="images/header-avatar.jpg" alt="карат">
        <div class="profile-info">
            <span class="profile-name">карат</span>
            <span>11</span>
            <span>Святая Сибирь, Российская Федерация</span>
        </div>
    </header>

    <div class="split">

    <!-- Левый белый блок с GIF -->
    <div class="left-block">
        <a class='gif-link' href='page-left'>
            <div class="gif-box">
                <img src="images/left-image.gif" alt="Left GIF">
            </div>
        </a>
    </div>

    <!-- Правый блок с GIF фоном и плавающим квадратом -->
    <div class="right-block">
        <a class='text-link' href='page-right'>FRAGMENTED PERSONALITY 0.1</a>
    </div>

    </div>

    </div>

    <script>
        // На телефоне — лёгкая версия видео
        (function () {
            var video = document.getElementById('introVideo');
            video.src = window.matchMedia('(max-width: 768px)').matches
                ? 'video/intro-mobile.mp4'
                : 'video/intro.mp4';
            var playing = video.play();
            if (playing && playing.catch) playing.catch(function () {});
        })();
    </script>

</body>
</html>
